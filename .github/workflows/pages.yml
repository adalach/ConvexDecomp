# The search explorer demo on GitHub Pages: tools/search_explorer/build_static.py builds a static
# site that runs the search in the browser with Pyodide. Needs Settings > Pages > Source: GitHub Actions.
name: Search explorer demo

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tools/search_trace.py"
      - "tools/search_explorer/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the build's dependencies
        run: python -m pip install "shapely==2.1.2" numpy
      - name: Build the static explorer
        run: python tools/search_explorer/build_static.py --out site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
